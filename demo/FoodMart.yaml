schema:
  name: "FoodMart"
  metamodel_version: "4.0"
physical_schema:
  tables:
  - name: "salary"
  - name: "salary"
    alias: "salary2"
  - name: "department"
    key:
    - "department_id"
  - name: "employee"
    key:
    - "employee_id"
  - name: "employee_closure"
    key:
    - "employee_id"
  - name: "position"
    key:
    - "position_id"
  - name: "promotion"
    key:
    - "promotion_id"
  - name: "store"
    key:
    - "store_id"
  - name: "product"
    key_column: "product_id"
  - name: "product_class"
    key_column: "product_class_id"
  - name: "time_by_day"
    key:
    - "time_id"
  - name: "customer"
    key:
    - "customer_id"
    calculated_columns:
    - name: "full_name"
      type: "String"
      expression:
        oracle: "\n                            {col:fname}  || ' ' || {col:lname}\n\
          \                        "
        access: "\n                            {col:fname}  + ' ' + {col:lname}\n\
          \                        "
        postgres: "\n                            {col:fname}  || ' ' || {col:lname}\n\
          \                        "
        mysql: "\n                            CONCAT({col:fname}, ' ', {col:lname})\n\
          \                        "
        mssql: "\n                            {col:fname} + ' ' + {col:lname}\n  \
          \                      "
        derby: "\n                            {col:fullname}\n                   \
          \     "
        db2: "\n                            CONCAT(CONCAT({col:fname}, ' '), {col:lname})\n\
          \                        "
        luciddb: "\n                            {col:fname}  || ' ' || {col:lname}\n\
          \                        "
        generic: "\n                            {col:fullname}\n                 \
          \       "
  - name: "sales_fact_1997"
    calculated_columns:
    - name: "promotion_sales"
      expression:
        access: "\n                            Iif({col:sales_fact_1997.promotion_id}\
          \ = 0, 0,\n                            {col:sales_fact_1997.store_sales})\n\
          \                        "
        generic: "\n                        case when {col:sales_fact_1997.promotion_id}\
          \ = 0 then 0\n                        else {col:sales_fact_1997.store_sales}\
          \ end\n                    "
  - name: "inventory_fact_1997"
    calculated_columns:
    - name: "warehouse_profit"
      expression:
        generic: "\n                            {col:inventory_fact_1997.warehouse_sales}\n\
          \                            -\n                            {col:warehouse_cost}\n\
          \                        "
  - name: "warehouse"
    key:
    - "warehouse_id"
  - name: "agg_c_special_sales_fact_1997"
  - name: "agg_pl_01_sales_fact_1997"
  - name: "agg_l_05_sales_fact_1997"
  - name: "agg_g_ms_pcat_sales_fact_1997"
  - name: "agg_c_14_sales_fact_1997"
  links:
  - source: "employee"
    target: "employee_closure"
    foreign_key:
    - "employee_id"
  - source: "position"
    target: "employee"
    foreign_key:
    - "position_id"
  - source: "store"
    target: "employee"
    foreign_key:
    - "store_id"
  - source: "product_class"
    target: "product"
    foreign_key:
    - "product_class_id"
shared_dimensions:
  Store:
    table: "store"
    key: "Store Id"
    attributes:
    - name: "Store Country"
      key:
      - "store_country"
      has_hierarchy: false
    - name: "Store State"
      key_column: "store_state"
      has_hierarchy: false
    - name: "Store City"
      key:
      - "store_state"
      - "store_city"
      name_column: "store_city"
      has_hierarchy: false
    - name: "Store Id"
      key_column: "store_id"
      has_hierarchy: false
    - name: "Store Name"
      key_column: "store_name"
      has_hierarchy: false
      properties:
      - "Store Type"
      - "Store Manager"
      - "Store Sqft"
      - "Grocery Sqft"
      - "Frozen Sqft"
      - "Meat Sqft"
      - "Has coffee bar"
      - "Street address"
    - name: "Store Type"
      key_column: "store_type"
      hierarchy_all_member_name: "All Store Types"
    - name: "Store Manager"
      key_column: "store_manager"
      has_hierarchy: false
    - name: "Store Sqft"
      key_column: "store_sqft"
      has_hierarchy: false
    - name: "Grocery Sqft"
      key_column: "grocery_sqft"
      has_hierarchy: false
    - name: "Frozen Sqft"
      key_column: "frozen_sqft"
      has_hierarchy: false
    - name: "Meat Sqft"
      key_column: "meat_sqft"
      has_hierarchy: false
    - name: "Has coffee bar"
      key_column: "coffee_bar"
