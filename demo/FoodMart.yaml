        foreign_key_column: "time_id"
      - type: "foreign_key"
        dimension: "Product"
        foreign_key_column: "product_id"
      - type: "foreign_key"
        dimension: "Promotion"
        foreign_key_column: "promotion_id"
      - type: "foreign_key"
        dimension: "Customer"
        foreign_key_column: "customer_id"
      - type: "no_link"
        dimension: "Warehouse"
    - name: "Warehouse"
      table: "inventory_fact_1997"
      measures:
      - name: "Store Invoice"
        column: "store_invoice"
        aggregator: "sum"
      - name: "Supply Time"
        column: "supply_time"
        aggregator: "sum"
      - name: "Warehouse Cost"
        column: "warehouse_cost"
        aggregator: "sum"
      - name: "Warehouse Sales"
        column: "warehouse_sales"
        aggregator: "sum"
      - name: "Units Shipped"
        column: "units_shipped"
        aggregator: "sum"
        format_string: "#.0"
      - name: "Units Ordered"
        column: "units_ordered"
        aggregator: "sum"
        format_string: "#.0"
      - name: "Warehouse Profit"
        column: "warehouse_profit"
        aggregator: "sum"
        datatype: "Numeric"
      dimension_links:
      - type: "foreign_key"
        dimension: "Store"
        foreign_key_column: "store_id"
      - type: "foreign_key"
        dimension: "Time"
        foreign_key_column: "time_id"
      - type: "foreign_key"
        dimension: "Product"
        foreign_key_column: "product_id"
      - type: "foreign_key"
        dimension: "Warehouse"
        foreign_key:
        - "warehouse_id"
      - type: "no_link"
        dimension: "Promotion"
      - type: "no_link"
        dimension: "Customer"
    calculated_members:
    - name: "Profit"
      dimension: "Measures"
      formula: "[Measures].[Store Sales] - [Measures].[Store Cost]"
      properties:
      - name: "FORMAT_STRING"
        value: "$#,##0.00"
    - name: "Profit last Period"
      dimension: "Measures"
      visible: false
      formula: "COALESCEEMPTY((Measures.[Profit], [Time].[Time].PREVMEMBER),    Measures.[Profit])"
      properties:
      - name: "FORMAT_STRING"
        value: "$#,##0.00"
    - name: "Profit Growth"
      dimension: "Measures"
      caption: "Gewinn-Wachstum"
      visible: true
      formula: "([Measures].[Profit] - [Measures].[Profit last Period]) / [Measures].[Profit\
        \ last Period]"
      properties:
      - name: "FORMAT_STRING"
        value: "0.0%"
    - name: "Average Warehouse Sale"
      dimension: "Measures"
      formula: "[Measures].[Warehouse Sales] / [Measures].[Warehouse Cost]"
      properties:
      - name: "FORMAT_STRING"
        value: "$#,##0.00"
    - name: "Profit Per Unit Shipped"
      dimension: "Measures"
      formula: "[Measures].[Profit] / [Measures].[Units Shipped]"
