      has_hierarchy: false
    - name: "Product Name"
      table: "product"
      key_column: "product_id"
      name_column: "product_name"
      has_hierarchy: false
    - name: "Product Id"
      table: "product"
      key_column: "product_id"
      has_hierarchy: false
