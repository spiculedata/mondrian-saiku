      dimension: "Measures"
      formula: "[Measures].[Store Sales] - [Measures].[Store Cost]"
      properties:
      - name: "FORMAT_STRING"
        value: "$#,##0.00"
    - name: "Profit last Period"
      dimension: "Measures"
      visible: false
      formula: "COALESCEEMPTY((Measures.[Profit], [Time].[Time].PREVMEMBER),    Measures.[Profit])"
      properties:
      - name: "FORMAT_STRING"
        value: "$#,##0.00"
    - name: "Profit Growth"
      dimension: "Measures"
      caption: "Gewinn-Wachstum"
      visible: true
      formula: "([Measures].[Profit] - [Measures].[Profit last Period]) / [Measures].[Profit\
